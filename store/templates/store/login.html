
{% extends 'store/base.html' %}

{% block title %}Login - BookStore{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <span class="small-label">
            WELCOME BACK
        </span>

        <h1>Login</h1>

        <p class="auth-description">
            Login to continue shopping.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <label>Username</label>

            <input
                type="text"
                name="username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >


            <button type="submit"
                    class="primary-btn full-btn">
                Login
            </button>

        </form>


        <p class="auth-footer">
            Don't have an account?

            <a href="{% url 'register' %}">
                Register
            </a>
        </p>

    </div>

</section>

{% endblock %}
