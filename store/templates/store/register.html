
{% extends 'store/base.html' %}

{% block title %}Register - BookStore{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <span class="small-label">
            JOIN BOOKSTORE
        </span>

        <h1>Create Account</h1>

        <p class="auth-description">
            Create an account to start shopping.
        </p>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}


            <button type="submit"
                    class="primary-btn full-btn">
                Create Account
            </button>

        </form>


        <p class="auth-footer">
            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</section>

{% endblock %}
